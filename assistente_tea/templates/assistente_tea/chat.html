{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente TEA</title>

    <!-- Importação do CSS personalizado -->
    <link rel="stylesheet" href="{% static 'assistente_tea/css/chat.css' %}">
</head>

<body>
    <main>
        <h1>Assistente TEA</h1>

        <p>
            Protótipo de assistente com comunicação clara, estruturada e previsível.
        </p>

        <form id="chat-form" class="chat-form">
            {% csrf_token %}

            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite sua mensagem aqui..."></textarea>

            <div class="form-actions">
                <button type="submit">Enviar</button>

                <a href="{% url 'assistente_tea:nova_conversa' %}" class="btn-link">
                    Nova conversa
                </a>
            </div>
        </form>

        <hr>

        <section>
            <h2>Resposta</h2>
            <!-- Div utilizada para exibir a resposta com suporte a acessibilidade -->
            <div id="resposta" aria-live="polite" role="status" class="resposta-box">
                Aguardando interação...
            </div>
        </section>
    </main>

    <!-- Importação do JavaScript -->
    <script src="{% static 'assistente_tea/js/chat.js' %}"></script>
</body>

</html>
